<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Registration</title>
</head>
<body>

    <h1>GasGo!</h1>
<p>LPG Cylinder Management and Delivery System</p>

    <h2>Seller Registration</h2>

    <nav>
        <a href="register.html">Seller Registration</a> |
        <a href="dashboard.html">Seller Dashboard</a>
    </nav>

    <hr>

    <h3>Seller Registration Form</h3>
    <p>Fill in your details to register as an LPG seller.</p>

    <form action="success.html" method="get">

        <fieldset>
            <legend>Seller Information</legend>

            <p>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </p>

            <p>
                <label for="shopname">Business/Shop Name:</label>
                <input type="text" id="shopname" name="shopname" required>
            </p>

            <p>
                <label for="sellerid">Seller ID:</label>
                <input type="text" id="sellerid" name="sellerid" required>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" minlength="8" required>
            </p>

            <p>
                <label for="license">Trade License Number:</label>
                <input type="text" id="license" name="license" required>
            </p>

            <p>
    <label for="address">Business Address:</label>
    <input type="text" id="address" name="address" required>
</p>

            <p>
                <label for="area">Service Area:</label>
                <input type="text" id="area" name="area" required>
            </p>

        </fieldset>

        <br>

        <fieldset>
            <legend>Business Opening Hours</legend>

            <p>
                <label for="opening">Opening Time:</label>
                <input type="time" id="opening" name="opening" required>
            </p>

            <p>
                <label for="closing">Closing Time:</label>
                <input type="time" id="closing" name="closing" required>
            </p>

        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">

    </form>

</body>
</html>
